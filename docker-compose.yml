# Local development stack. The credentials below are for the throwaway
# development database only.
services:
  web:
    build: .
    ports:
      - "4330:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: dev
      DB_NAME: EmporioSolidale
      # Demo mode: no real mail, fixed credentials, data in db/ loaded again
      # when the login page is opened and the last time was over an hour ago.
      DEMO_MODE: "1"
      DEMO_RESET_MINUTES: "60"
      # Shown on the login page: the account of the demo data in db/.
      DEMO_LOGIN_HINT: emporiosolidale / IlSole
    depends_on:
      db:
        condition: service_healthy

  db:
    # MySQL 8.0, as on the host the demo is deployed to.
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: EmporioSolidale
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, so it only passes once the files in db/ have been loaded:
      # while they are, the server listens on its socket alone.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -pdev -e 'SELECT 1 FROM EmporioSolidale.StatoDemo LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
