# Local development stack. The credentials below are for the throwaway
# development database only.
services:
  web:
    build: .
    ports:
      - "4330:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: dev
      DB_NAME: EmporioSolidale
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    # Mirrors the XAMPP database the 2021 code was written against: table
    # names compared case-insensitively (the code and the views mix casing)
    # and no strict mode (empty strings are sent for missing dates and numbers).
    command: --lower-case-table-names=1 --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: EmporioSolidale
    volumes:
      - ./db/EmporioSolidale.sql:/docker-entrypoint-initdb.d/EmporioSolidale.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
