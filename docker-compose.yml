# Local development stack. The credentials below are for the throwaway
# development database only.
services:
  web:
    build: .
    ports:
      - "4330:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: dev
      DB_NAME: EmporioSolidale
      # Shown on the login page: the account of the demo data in db/.
      DEMO_LOGIN_HINT: emporiosolidale / IlSole
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: dev
      MARIADB_DATABASE: EmporioSolidale
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
